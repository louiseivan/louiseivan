name: update recent activity

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-activity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Readme-Workflows/recent-activity@v2.3.0
        with:
          GH_USERNAME: louiseivan
          MAX_LINES: 5
          COMMIT_MSG: "chore: update recent activity"
          PUSH_TEMPLATE: "⬆️ Pushed {AMOUNT} commit(s) to {REPO_LINK}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
